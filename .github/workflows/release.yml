name: GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and create draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate release provenance and versions
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Tag $GITHUB_REF_NAME commit $tag_commit is not on origin/${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME commit $tag_commit is on origin/${DEFAULT_BRANCH}"
          bash scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependency locks
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          bash scripts/publish-crates-io.sh --audit

      - name: Audit frontend dependency lock
        working-directory: apps/desktop
        run: npm audit --package-lock-only --audit-level=moderate

      - name: Run release tests
        run: cargo test --locked --all-targets --features full

      - name: Validate DeepFilterNet speech quality
        run: |
          cargo build --locked --features full --bin denoize
          python3 scripts/validate-deepfilter.py --denoize target/debug/denoize

      - name: Verify generated CLI reference
        run: |
          # The release test matrix builds the full-featured CLI. Rebuild the
          # documented no-default binary so the check is independent of the
          # preceding test targets.
          cargo build --locked --no-default-features --bin denoize
          bash scripts/generate-cli-docs.sh --check

      - name: Verify release evidence tooling
        run: |
          bash -n \
            scripts/package-release-evidence.sh \
            scripts/publish-crates-io.sh \
            scripts/release-evidence-assets.sh \
            scripts/test-release-evidence.sh \
            scripts/verify-release-assets.sh \
            scripts/verify-release-evidence.sh
          python3 -c 'compile(open("scripts/generate-release-evidence.py", encoding="utf-8").read(), "scripts/generate-release-evidence.py", "exec")'
          for schema in schemas/*.schema.json; do
            jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' \
              "$schema" >/dev/null
          done
          bash scripts/test-release-evidence.sh

      - name: Verify crates.io package
        run: |
          bash scripts/publish-crates-io.sh --test
          bash scripts/publish-crates-io.sh --dry-run

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            release_args=(
              --draft
              --verify-tag
              --generate-notes
              --title "denoize $GITHUB_REF_NAME"
            )
            notes_file="docs/releases/${GITHUB_REF_NAME}.md"
            if [[ -f "$notes_file" ]]; then
              echo "Prepending curated release notes from $notes_file."
              release_args+=(--notes-file "$notes_file")
            fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Enable legacy CMake policy compatibility (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          real_cmake=$(command -v cmake)
          wrapper="$RUNNER_TEMP/denoize-cmake"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          case "\${1:-}" in
            --build|--install|--open|--help|--version|-E)
              exec "$real_cmake" "\$@"
              ;;
            *)
              exec "$real_cmake" "\$@" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
              ;;
          esac
          EOF
          chmod +x "$wrapper"
          echo "CMAKE=$wrapper" >> "$GITHUB_ENV"

      - name: Enable legacy CMake policy compatibility (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wrapper = Join-Path $env:RUNNER_TEMP "denoize-cmake.cmd"
          @'
          @echo off
          if /I "%~1"=="--build" goto passthrough
          if /I "%~1"=="--install" goto passthrough
          cmake.exe %* -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          exit /b %errorlevel%
          :passthrough
          cmake.exe %*
          '@ | Set-Content -Encoding ascii $wrapper
          "CMAKE=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --locked --release --features full

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="denoize-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$package"
          cp target/release/denoize README.md LICENSE THIRD_PARTY.md "$package/"
          cp -R LICENSES "$package/"
          tar -czf "$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "denoize-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/denoize.exe, README.md, LICENSE, THIRD_PARTY.md -Destination $package
          Copy-Item LICENSES -Destination "$package/LICENSES" -Recurse
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$package.zip.sha256"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            denoize-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }} \
            denoize-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}.sha256 \
            --clobber

  desktop-build:
    name: Desktop ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libayatana-appindicator3-dev

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload desktop bundles
        # tauri-apps/tauri-action v1.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: denoize ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  model-catalog:
    name: Sign catalog and build offline model bundle
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Tauri signer
        working-directory: apps/desktop
        run: npm ci

      - name: Sign catalog, build bundle, and upload model assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # GitHub-hosted runners can attach extended ACLs to /home. Keep every
          # generated model asset under a private /tmp directory so the bundle's
          # atomic-output checks retain their strict ancestor policy.
          asset_dir="$(mktemp -d /tmp/denoize-release.XXXXXX)"
          asset="$asset_dir/denoize-model-catalog-v1.json"
          trust_asset="$asset_dir/denoize-model-trust-root-v1.json"
          automation_schema="$asset_dir/denoize-automation-v1.schema.json"
          cli_schema="$asset_dir/denoize-cli-output-v1.schema.json"
          hardware_schema="$asset_dir/denoize-hardware-v1.schema.json"
          recommendation_schema="$asset_dir/denoize-recommendation-v1.schema.json"
          release_evidence_schema="$asset_dir/denoize-release-evidence-v1.schema.json"
          execution_plan_schema="$asset_dir/denoize-execution-plan-v1.schema.json"
          execution_receipt_schema="$asset_dir/denoize-execution-receipt-v1.schema.json"
          receipt_public_key_schema="$asset_dir/denoize-receipt-public-key-v1.schema.json"
          receipt_secret_key_schema="$asset_dir/denoize-receipt-secret-key-v1.schema.json"
          receipt_trust_policy_schema="$asset_dir/denoize-receipt-trust-policy-v1.schema.json"
          receipt_verification_schema="$asset_dir/denoize-receipt-verification-v1.schema.json"
          bundle="$asset_dir/denoize-models-${GITHUB_REF_NAME}.dmb"
          bundle_checksum="$bundle.sha256"
          cp models/catalog-v1.json "$asset"
          cp models/trust-root-v1.json "$trust_asset"
          cp schemas/denoize-automation-v1.schema.json "$automation_schema"
          cp schemas/denoize-cli-output-v1.schema.json "$cli_schema"
          cp schemas/denoize-hardware-v1.schema.json "$hardware_schema"
          cp schemas/denoize-recommendation-v1.schema.json "$recommendation_schema"
          cp schemas/denoize-release-evidence-v1.schema.json "$release_evidence_schema"
          cp schemas/denoize-execution-plan-v1.schema.json "$execution_plan_schema"
          cp schemas/denoize-execution-receipt-v1.schema.json "$execution_receipt_schema"
          cp schemas/denoize-receipt-public-key-v1.schema.json "$receipt_public_key_schema"
          cp schemas/denoize-receipt-secret-key-v1.schema.json "$receipt_secret_key_schema"
          cp schemas/denoize-receipt-trust-policy-v1.schema.json "$receipt_trust_policy_schema"
          cp schemas/denoize-receipt-verification-v1.schema.json "$receipt_verification_schema"
          (
            cd apps/desktop
            # The existing updater key is passwordless. The standalone signer
            # otherwise tries to prompt on a non-interactive Actions runner.
            npm run tauri -- signer sign --password "" "$asset"
          )
          bash scripts/build-offline-model-bundle.sh \
            "$bundle" "$bundle_checksum" "$asset" "$asset.sig" "$trust_asset"
          gh release upload "$GITHUB_REF_NAME" \
            "$asset" "$asset.sig" "$trust_asset" \
            "$automation_schema" "$cli_schema" "$hardware_schema" \
            "$recommendation_schema" "$release_evidence_schema" \
            "$execution_plan_schema" "$execution_receipt_schema" \
            "$receipt_public_key_schema" "$receipt_secret_key_schema" \
            "$receipt_trust_policy_schema" "$receipt_verification_schema" \
            "$bundle" "$bundle_checksum" --clobber

  release-evidence:
    name: Generate release SBOMs and provenance
    needs: [build, desktop-build, model-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Download installable release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir=$(mktemp -d /tmp/denoize-release-assets.XXXXXX)
          evidence_dir="$RUNNER_TEMP/denoize-release-evidence-v1"
          asset_spec="$RUNNER_TEMP/release-primary-assets.tsv"
          bash scripts/release-evidence-assets.sh primary "$GITHUB_REF_NAME" > "$asset_spec"
          while IFS=$'\t' read -r kind target name; do
            if [[ "$kind" != crate ]]; then
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$name" --dir "$asset_dir"
            fi
          done < "$asset_spec"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          source_commit=$(git rev-parse HEAD)
          {
            echo "DENOIZE_RELEASE_ASSET_DIR=$asset_dir"
            echo "DENOIZE_RELEASE_EVIDENCE_DIR=$evidence_dir"
            echo "DENOIZE_RELEASE_ASSET_SPEC=$asset_spec"
            echo "DENOIZE_RELEASE_SOURCE_COMMIT=$source_commit"
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
          } >> "$GITHUB_ENV"

      - name: Package exact crates.io archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          package="$DENOIZE_RELEASE_ASSET_DIR/denoize-${version}.crate"
          bash scripts/publish-crates-io.sh --package-only "$package"
          (
            cd "$DENOIZE_RELEASE_ASSET_DIR"
            sha256sum "$(basename "$package")" > "$(basename "$package").sha256"
          )
          gh release upload "$GITHUB_REF_NAME" \
            "$package" "$package.sha256" --clobber

      - name: Install pinned Syft
        id: syft
        # anchore/sbom-action v0, with the scanner itself fixed below.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.50.0

      - name: Generate per-artifact CycloneDX SBOMs
        shell: bash
        run: |
          python3 scripts/generate-release-evidence.py generate \
            --tag "$GITHUB_REF_NAME" \
            --commit "$DENOIZE_RELEASE_SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --repository-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$DENOIZE_RELEASE_ASSET_DIR" \
            --asset-spec "$DENOIZE_RELEASE_ASSET_SPEC" \
            --model-catalog "$GITHUB_WORKSPACE/models/catalog-v1.json" \
            --syft "${{ steps.syft.outputs.cmd }}" \
            --syft-version 1.50.0 \
            --output-dir "$DENOIZE_RELEASE_EVIDENCE_DIR"

      - name: Attest installable release artifacts
        id: attest-subjects
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/denoize-release-evidence-v1/subjects.sha256

      - name: Assemble reproducible offline evidence archive
        shell: bash
        run: |
          cp scripts/verify-release-evidence.sh \
            "$DENOIZE_RELEASE_EVIDENCE_DIR/verify-release-evidence.sh"
          cp schemas/denoize-release-evidence-v1.schema.json \
            "$DENOIZE_RELEASE_EVIDENCE_DIR/denoize-release-evidence-v1.schema.json"
          cp docs/release-evidence.md "$DENOIZE_RELEASE_EVIDENCE_DIR/README.md"
          python3 scripts/generate-release-evidence.py finalize \
            --output-dir "$DENOIZE_RELEASE_EVIDENCE_DIR"
          evidence_archive="$RUNNER_TEMP/denoize-release-evidence-${GITHUB_REF_NAME}.tar.gz"
          bash scripts/package-release-evidence.sh \
            "$DENOIZE_RELEASE_EVIDENCE_DIR" \
            "$evidence_archive" \
            "$SOURCE_DATE_EPOCH"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$evidence_archive")" \
              > "$(basename "$evidence_archive").sha256"
          )
          echo "DENOIZE_RELEASE_EVIDENCE_ARCHIVE=$evidence_archive" >> "$GITHUB_ENV"

      - name: Attest offline evidence archive
        id: attest-evidence
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/denoize-release-evidence-${{ github.ref_name }}.tar.gz

      - name: Upload release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_bundle="$DENOIZE_RELEASE_EVIDENCE_ARCHIVE.sigstore.json"
          subjects_bundle="$DENOIZE_RELEASE_ASSET_DIR/denoize-release-subjects-${GITHUB_REF_NAME}.sigstore.json"
          trusted_root="$DENOIZE_RELEASE_ASSET_DIR/denoize-sigstore-trusted-root.jsonl"
          cp "${{ steps.attest-evidence.outputs.bundle-path }}" "$evidence_bundle"
          cp "${{ steps.attest-subjects.outputs.bundle-path }}" "$subjects_bundle"
          gh attestation trusted-root > "$trusted_root"
          gh release upload "$GITHUB_REF_NAME" \
            "$DENOIZE_RELEASE_EVIDENCE_ARCHIVE" \
            "$DENOIZE_RELEASE_EVIDENCE_ARCHIVE.sha256" \
            "$evidence_bundle" \
            "$subjects_bundle" \
            "$trusted_root" \
            --clobber

  publish:
    name: Publish release
    needs: publish-crate
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  verify-assets:
    name: Verify release assets
    needs: release-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-assets.sh "$GITHUB_REF_NAME"

  publish-crate:
    name: Publish crates.io package
    needs: verify-assets
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Publish denoize to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="$RUNNER_TEMP/denoize-${version}.crate"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$(basename "$package")" \
            --dir "$RUNNER_TEMP"
          expected_checksum=$(sha256sum "$package" | awk '{print $1}')
          response=$(curl --fail --silent --show-error \
            --user-agent "denoize-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/denoize" || true)
          if jq -e --arg version "$version" \
            '.versions[]? | select(.num == $version)' <<<"$response" >/dev/null; then
            echo "denoize $version is already published; skipping."
          else
            if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
              echo "CRATES_IO_TOKEN is not configured in the crates-io environment." >&2
              exit 1
            fi
            bash scripts/publish-crates-io.sh --expected-package "$package"
          fi
          published_checksum=""
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent --show-error \
              --user-agent "denoize-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/denoize" || true)
            published_checksum=$(jq -r --arg version "$version" \
              '.versions[]? | select(.num == $version) | .checksum' <<<"$response" | head -n 1)
            if [[ -n "$published_checksum" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$published_checksum" != "$expected_checksum" ]]; then
            echo "crates.io checksum mismatch: expected $expected_checksum, got ${published_checksum:-<missing>}" >&2
            exit 1
          fi
          echo "crates.io denoize $version matches release evidence checksum $expected_checksum"
