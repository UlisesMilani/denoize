name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit CLI and library dependencies
        run: cargo audit --file Cargo.lock

      - name: Audit desktop dependencies
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

      - name: Audit fuzz harness dependencies
        run: cargo audit --file fuzz/Cargo.lock

      - name: Audit crates.io dependencies
        run: bash scripts/publish-crates-io.sh --audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Verify synchronized release versions
        run: bash scripts/verify-release-version.sh

      - name: Test all features
        run: cargo test --locked --all-targets --features full

      - name: Run bounded deterministic resilience matrix
        env:
          DENOIZE_RESILIENCE_FEATURES: full
          DENOIZE_RESILIENCE_TIMEOUT_SECONDS: "180"
        run: bash scripts/test-resilience.sh

      - name: Validate DeepFilterNet speech quality
        run: |
          cargo build --locked --features full --bin denoize
          python3 scripts/validate-deepfilter.py --denoize target/debug/denoize

      - name: Test crates.io feature set
        run: bash scripts/publish-crates-io.sh --test

      - name: Check release scripts
        run: |
          bash -n \
            scripts/build-offline-model-bundle.sh \
            scripts/generate-cli-docs.sh \
            scripts/package-release-evidence.sh \
            scripts/publish-crates-io.sh \
            scripts/release-evidence-assets.sh \
            scripts/test-resilience.sh \
            scripts/test-release-evidence.sh \
            scripts/verify-release-assets.sh \
            scripts/verify-release-evidence.sh \
            scripts/verify-release-version.sh
          python3 -c 'compile(open("scripts/generate-release-evidence.py", encoding="utf-8").read(), "scripts/generate-release-evidence.py", "exec")'
          for schema in schemas/*.schema.json; do
            jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' \
              "$schema" >/dev/null
          done

      - name: Test release evidence generation and offline verification
        run: bash scripts/test-release-evidence.sh

  cli-docs:
    name: CLI documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Verify generated CLI reference
        run: bash scripts/generate-cli-docs.sh --check

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev xvfb

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test accessibility in a real WebView
        working-directory: apps/desktop
        run: npm run test:a11y:webview

      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Test desktop command layer
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features live

  desktop-packaging:
    name: Desktop packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libayatana-appindicator3-dev

      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Test Windows output commit paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib atomic_output::tests
          cargo test --locked --no-default-features --test cli_output_commit
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features live --lib

      - name: Test macOS output commit paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib atomic_output::tests
          cargo test --locked --no-default-features --test cli_output_commit

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop bundles
        working-directory: apps/desktop
        shell: bash
        run: >-
          npm run tauri -- build --ci --no-sign
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
