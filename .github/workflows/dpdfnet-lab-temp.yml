name: Build DPDFNet-8 Lab temporary CLAP

on:
  push:
    branches:
      - dpdfnet-lab-temp
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  DPDFNET8_MODEL_SHA256: 7b3afbb260a08fe9af3d16e3bda992971be1e7e951d1dee7c2d235f5c43f5631
  DPDFNET8_MODEL_URL: https://huggingface.co/Ceva-IP/DPDFNet/resolve/dd6818d00f50c836fed43a6243ebe49116de5964/onnx/dpdfnet8_48khz_hr.onnx

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select Rust 1.96
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add x86_64-pc-windows-msvc

      - name: Patch temporary DPDFNet-8 Lab build
        shell: bash
        run: python scripts/dpdfnet8-lab-patch.py

      - name: Build DPDFNet-8 Lab CLAP
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc \
            -p denoize-clap --features experimental-dpdfnet-hq

      - name: Package plug-in and pinned model
        shell: bash
        run: |
          mkdir -p dist/models/dpdfnet8-48khz-hr
          cp target/x86_64-pc-windows-msvc/release/denoize_clap.dll dist/DPDFNet-8-Lab.clap
          curl --fail --location --retry 5 \
            --output dist/models/dpdfnet8-48khz-hr/dpdfnet8_48khz_hr.onnx \
            "$DPDFNET8_MODEL_URL"
          observed=$(sha256sum dist/models/dpdfnet8-48khz-hr/dpdfnet8_48khz_hr.onnx | awk '{print $1}')
          test "$observed" = "$DPDFNET8_MODEL_SHA256"
          cat > dist/install-model.cmd <<'CMD'
          @echo off
          setlocal
          set "DEST=%LOCALAPPDATA%\denoize\models\dpdfnet8-48khz-hr"
          if not exist "%DEST%" mkdir "%DEST%"
          copy /Y "%~dp0models\dpdfnet8-48khz-hr\dpdfnet8_48khz_hr.onnx" "%DEST%\dpdfnet8_48khz_hr.onnx" >nul
          if errorlevel 1 (
            echo Error copying DPDFNet-8 model.
            exit /b 1
          )
          echo DPDFNet-8 model installed in:
          echo %DEST%
          endlocal
          CMD
          cat > dist/README.txt <<'TXT'
          DPDFNet-8 Lab - temporary Windows CLAP build

          Same lab policy as the previous DPDFNet-2 build, but using the official
          CEVA DPDFNet-8 48 kHz HR ONNX graph.

          Identity:
          - CLAP ID: org.ulisesmilani.dpdfnet8-lab
          - Name: DPDFNet-8 Lab
          - Vendor shown by REAPER: DPDFNet Lab

          Processing:
          - Host rate: exactly 48000 Hz
          - Latency: 500 ms
          - Queue: 64 chunks
          - Block pool: 96
          - Default fallback: Silence

          Install:
          1. Run install-model.cmd once.
          2. Copy DPDFNet-8-Lab.clap to a CLAP folder scanned by REAPER.
          3. Restart REAPER or rescan plug-ins.
          4. Use 48000 Hz and start with a 128-sample host buffer.
          5. Leave Mix at 100%, Output Gain at 0 dB and fallback at Silence.
          TXT

      - name: Upload DPDFNet-8 Lab artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: DPDFNet-8-Lab-Windows
          path: dist
          if-no-files-found: error
          retention-days: 7
