name: Build DPDFNet Lab temporary CLAP

on:
  push:
    branches:
      - dpdfnet-lab-temp
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  DPDFNET_MODEL_SHA256: 7f0575a5cec0ba4ffd8f8bd657e06d007e4ccdd955d76faab922b9d3291dc14b
  DPDFNET_MODEL_URL: https://huggingface.co/Ceva-IP/DPDFNet/resolve/dd6818d00f50c836fed43a6243ebe49116de5964/onnx/dpdfnet2_48khz_hr.onnx

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select Rust 1.96
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add x86_64-pc-windows-msvc

      - name: Patch temporary DPDFNet Lab build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/neural_daw.rs")
          text = root.read_text(encoding="utf-8")
          replacements = [
              ('pub const NEURAL_HQ_DAW_PLUGIN_ID: &str = "org.penguin425.denoize.neural-hq";',
               'pub const NEURAL_HQ_DAW_PLUGIN_ID: &str = "org.ulisesmilani.dpdfnet-lab";'),
              ('pub const NEURAL_DAW_LATENCY_CHUNKS: u32 = 24;',
               'pub const NEURAL_DAW_LATENCY_CHUNKS: u32 = 50;'),
              ('pub const NEURAL_DAW_LATENCY_POLICY: &str = "fixed-24x10ms-worker-v1";',
               'pub const NEURAL_DAW_LATENCY_POLICY: &str = "fixed-50x10ms-lab-v1";'),
              ('overload_fallback: NeuralDawOverloadFallback::DelayedDry,',
               'overload_fallback: NeuralDawOverloadFallback::Silence,'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing expected source fragment: {old}")
              text = text.replace(old, new, 1)
          text = text.replace('Self::Dpdfnet2 => "denoize Neural HQ",',
                              'Self::Dpdfnet2 => "DPDFNet Lab",', 1)
          root.write_text(text, encoding="utf-8")

          neural = Path("plugins/denoize-clap/src/neural.rs")
          text = neural.read_text(encoding="utf-8")
          for old, new in [
              ('const QUEUE_BLOCKS: usize = 16;', 'const QUEUE_BLOCKS: usize = 64;'),
              ('const BLOCK_POOL_SIZE: usize = 40;', 'const BLOCK_POOL_SIZE: usize = 96;'),
              ('"denoize-neural".to_owned()', '"dpdfnet-lab".to_owned()'),
          ]:
              if old not in text:
                  raise SystemExit(f"missing expected neural fragment: {old}")
              text = text.replace(old, new, 1)
          text = text.replace("denoize Neural HQ", "DPDFNet Lab")
          text = text.replace(
              "Experimental off-callback DPDFNet-2 fullband speech restoration",
              "DPDFNet-2 48 kHz laboratory processor with 500 ms buffered latency",
          )
          text, count = re.subn(
              r'(name: "Overload Fallback",.*?default:\s*)0\.0,',
              r'\g<1>2.0,',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("could not set the accessible fallback default to Silence")
          neural.write_text(text, encoding="utf-8")

          lib = Path("plugins/denoize-clap/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          start = text.find("struct DenoizeFactory {")
          end = text.find("clack_plugin::clack_export_entry!(DenoizeEntry);")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("could not locate CLAP factory block")
          factory = r'''struct DenoizeFactory {
              #[cfg(feature = "experimental-dpdfnet-hq")]
              neural_hq: PluginDescriptor,
          }

          impl DenoizeFactory {
              fn new() -> Self {
                  Self {
                      #[cfg(feature = "experimental-dpdfnet-hq")]
                      neural_hq: <neural::NeuralHqPlugin as DefaultPluginFactory>::get_descriptor(),
                  }
              }
          }

          impl PluginFactoryImpl for DenoizeFactory {
              fn plugin_count(&self) -> u32 {
                  if cfg!(feature = "experimental-dpdfnet-hq") { 1 } else { 0 }
              }

              fn plugin_descriptor(&self, index: u32) -> Option<&PluginDescriptor> {
                  #[cfg(feature = "experimental-dpdfnet-hq")]
                  if index == 0 {
                      return Some(&self.neural_hq);
                  }
                  None
              }

              fn create_plugin<'a>(
                  &'a self,
                  host_info: HostInfo<'a>,
                  plugin_id: &CStr,
              ) -> Option<PluginInstance<'a>> {
                  #[cfg(feature = "experimental-dpdfnet-hq")]
                  if plugin_id == self.neural_hq.id().unwrap_or_default() {
                      return Some(PluginInstance::new::<neural::NeuralHqPlugin>(
                          host_info,
                          &self.neural_hq,
                          <neural::NeuralHqPlugin as DefaultPluginFactory>::new_shared,
                          <neural::NeuralHqPlugin as DefaultPluginFactory>::new_main_thread,
                      ));
                  }
                  None
              }
          }

          '''
          text = text[:start] + factory + text[end:]
          lib.write_text(text, encoding="utf-8")
          PY

      - name: Build DPDFNet Lab CLAP
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc \
            -p denoize-clap --features experimental-dpdfnet-hq

      - name: Package plug-in and pinned model
        shell: bash
        run: |
          mkdir -p dist/models/dpdfnet2-48khz-hr
          cp target/x86_64-pc-windows-msvc/release/denoize_clap.dll dist/DPDFNet-Lab.clap
          curl --fail --location --retry 5 \
            --output dist/models/dpdfnet2-48khz-hr/dpdfnet2_48khz_hr.onnx \
            "$DPDFNET_MODEL_URL"
          observed=$(sha256sum dist/models/dpdfnet2-48khz-hr/dpdfnet2_48khz_hr.onnx | awk '{print $1}')
          test "$observed" = "$DPDFNET_MODEL_SHA256"
          cat > dist/install-model.cmd <<'CMD'
          @echo off
          setlocal
          set "DEST=%LOCALAPPDATA%\denoize\models\dpdfnet2-48khz-hr"
          if not exist "%DEST%" mkdir "%DEST%"
          copy /Y "%~dp0models\dpdfnet2-48khz-hr\dpdfnet2_48khz_hr.onnx" "%DEST%\dpdfnet2_48khz_hr.onnx" >nul
          if errorlevel 1 (
            echo Error copying DPDFNet model.
            exit /b 1
          )
          echo DPDFNet model installed in:
          echo %DEST%
          endlocal
          CMD
          cat > dist/README.txt <<'TXT'
          DPDFNet Lab - temporary Windows CLAP build

          Purpose:
          Listen to the pinned DPDFNet-2 48 kHz HR model with a deliberately
          generous real-time buffer, without silently falling back to delayed
          dry audio when processing misses a deadline.

          Lab changes:
          - CLAP identity: org.ulisesmilani.dpdfnet-lab
          - Name: DPDFNet Lab
          - Reported/working latency: 500 ms (50 x 10 ms chunks)
          - Internal input/output queue: 64 chunks
          - Audio block pool: 96 blocks
          - Default Overload Fallback: Silence
          - DPDFNet-2 48 kHz HR only; the CLAP factory exposes no denoize or GTCRN descriptor

          Install:
          1. Run install-model.cmd once. It only copies the included verified
             ONNX file to %%LOCALAPPDATA%%\denoize\models\dpdfnet2-48khz-hr\.
          2. Copy DPDFNet-Lab.clap to a CLAP folder already scanned by REAPER.
             Using the same CLAP folder as your existing denoize.clap is fine.
          3. Rescan plug-ins or restart REAPER.
          4. Set the REAPER project/device sample rate to 48000 Hz.
          5. Start with a 128-sample host buffer.
          6. Load "DPDFNet Lab" and leave Mix at 100% and Overload Fallback at Silence.

          Important:
          Silence/microcuts indicate the processing path missed a result. They
          are intentionally not hidden by delayed dry audio, so they can be
          distinguished from DPDFNet's actual denoising behavior.
          TXT

      - name: Upload DPDFNet Lab artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: DPDFNet-Lab-Windows
          path: dist
          if-no-files-found: error
          retention-days: 7
