# crates.io distribution manifest.
#
# The DeepFilterNet Rust crate is not published on crates.io, so registry
# releases contain every crates.io-compatible backend except DeepFilterNet. The
# unreleased AAC encoder is also excluded; AAC/M4A decoding remains available.
# GitHub release binaries are built from Cargo.toml with the primary manifest's
# `full` feature set.

[package]
name = "denoize"
version = "0.90.2"
edition = "2021"
rust-version = "1.96"
authors = ["KAORU <133386210+penguin425@users.noreply.github.com>"]
description = "Pure-Rust audio denoiser with classical DSP and optional RNNoise"
license = "MIT"
readme = "README.md"
repository = "https://github.com/penguin425/denoize"
homepage = "https://github.com/penguin425/denoize"
documentation = "https://docs.rs/denoize"
keywords = ["audio", "denoise", "dsp", "stft", "noise-reduction"]
categories = ["multimedia::audio", "science"]
# Keep every pattern root-anchored: bare `README.md`/`LICENSE` patterns also
# match nested dependency files when a frontend install exists in the tree.
include = [
    "/Cargo.toml",
    "/Cargo.crates-io.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/LICENSES/*.txt",
    "/README.md",
    "/ROADMAP.md",
    "/THIRD_PARTY.md",
    "/sdk/capabilities.json",
    "/sdk/mobile-lifecycle.json",
    "/src/**/*.rs",
    "/src/decode/testdata/*",
    "/src/model_package/testdata/*",
    "/src/models/testdata/*",
    "/examples/**/*.rs",
    "/scripts/export-mpsenet.py",
    "/scripts/validate-mpsenet.py",
    "/scripts/export-bsrnn.py",
    "/scripts/export-mossformer2.py",
    "/scripts/validate-mossformer2.py",
    "/scripts/validate-bsrnn.py",
    "/scripts/export-sgmse.py",
    "/scripts/validate-sgmse.py",
    "/scripts/run-dpdfnet-gtcrn-poc.py",
    "/scripts/run-dpdfnet-gtcrn-evaluation.py",
    "/scripts/validate-dpdfnet-poc.py",
    "/scripts/prepare-dpdfnet-blind-listening.py",
    "/scripts/score-dpdfnet-blind-listening.py",
    "/scripts/generate-dpdfnet-platform-evidence.py",
    "/scripts/generate-dpdfnet-promotion-evidence.py",
    "/scripts/fetch-dpdfnet-reporter-evidence.py",
    "/scripts/test-dpdfnet-promotion-evidence.py",
    "/scripts/package-dpdfnet-experimental-clap.sh",
    "/scripts/test-reaper-dpdfnet-clap.ps1",
    "/scripts/reaper-clap-parameter-smoke.lua",
    "/scripts/generate-cli-docs.sh",
    "/scripts/test-diagnostic-schemas.py",
    "/scripts/test-project-schemas.py",
    "/scripts/test-restoration-schemas.py",
    "/scripts/test-universal-restoration-schemas.py",
    "/scripts/test-neural-daw-schemas.py",
    "/scripts/test-target-speaker-schemas.py",
    "/scripts/test-target-sound-schemas.py",
    "/scripts/test-causal-target-sound-schemas.py",
    "/scripts/test-aec-schemas.py",
    "/scripts/test-microphone-array-schemas.py",
    "/scripts/test-meeting-speaker-schemas.py",
    "/scripts/test-music-restoration-schemas.py",
    "/scripts/test-runtime-model-package-schemas.py",
    "/scripts/test-evaluation-evidence.sh",
    "/scripts/build-offline-model-bundle.sh",
    "/scripts/generate-release-evidence.py",
    "/scripts/package-release-evidence.sh",
    "/scripts/release-evidence-assets.sh",
    "/scripts/verify-release-evidence.sh",
    "/docs/cli.md",
    "/docs/diagnostics.md",
    "/docs/dpdfnet-gtcrn-poc.md",
    "/docs/dpdfnet-experimental-clap.md",
    "/docs/dpdfnet-reporter-template.md",
    "/docs/evaluation.md",
    "/docs/json.md",
    "/docs/models.md",
    "/docs/neural-plugin.md",
    "/docs/target-speaker.md",
    "/docs/target-sound.md",
    "/docs/acoustic-echo-cancellation.md",
    "/docs/microphone-array.md",
    "/docs/meeting-speakers.md",
    "/docs/music-restoration.md",
    "/docs/projects.md",
    "/docs/resilience.md",
    "/docs/release-evidence.md",
    "/docs/restoration-research.md",
    "/docs/restoration.md",
    "/docs/universal-restoration.md",
    "/docs/updates.md",
    "/schemas/*.json",
    "/models/*.json",
    "/models/licenses/*.txt",
    "/models/provenance/*.json",
]

[lib]
name = "denoize"
path = "src/lib.rs"

[[example]]
name = "dpdfnet_gtcrn_poc"
path = "examples/dpdfnet_gtcrn_poc.rs"
required-features = ["dpdfnet", "gtcrn"]

[[example]]
name = "dpdfnet_gtcrn_matrix"
path = "examples/dpdfnet_gtcrn_matrix.rs"
required-features = ["dpdfnet", "gtcrn"]

[[example]]
name = "dpdfnet_gtcrn_stress"
path = "examples/dpdfnet_gtcrn_stress.rs"
required-features = ["dpdfnet", "gtcrn"]

[[bin]]
name = "denoize"
path = "src/main.rs"

[dependencies]
hound = "3.5"
claxon = "0.4.3"
flacenc = "0.5.1"
ogg = "0.9.2"
opus = "0.3.1"
symphonia = { version = "0.6.0", default-features = false, features = ["aiff", "caf", "ogg", "vorbis", "alac", "id3v2", "isomp4", "mp3", "pcm"] }
nnnoiseless = { version = "0.5.2", optional = true, default-features = false }
nanomp3 = "0.1.1"
shine-rs = "0.1.3"
oxideav-aac = "0.1.6"
mp4 = "0.14.0"
rubato = "0.16.2"
rayon = "1.11.0"
ebur128 = "0.1.10"
lofty = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
cpal = { version = "0.15.3", optional = true }
ctrlc = "3.4.5"
tempfile = "3.27.0"
sha2 = "0.10.9"
minisign-verify = "0.2.5"
base64 = "0.22.1"
ring = "0.17.14"
zeroize = "1.8.2"
fs2 = "0.4.3"
percent-encoding = "2.3.2"
ureq = { version = "2.12.1", features = ["tls", "native-certs"] }
url = "2.5.8"
tract-onnx = { version = "=0.23.4", optional = true }
crossbeam-queue = { version = "0.3.12", optional = true }
rustfft = { version = "6.4", optional = true }
kaldi-native-fbank = { version = "0.1.0", optional = true }
audio_samples = { version = "2.0.1", optional = true, default-features = false }
audio_samples_qoe = { version = "0.1.3", optional = true }
ndarray = { version = "0.17.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
tract-metal = { version = "=0.23.4", optional = true }
metal = { version = "=0.33.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tract-cuda = { version = "=0.23.4", optional = true, default-features = false, features = ["cuda-12000"] }
cudarc = { version = "=0.19.9", optional = true, default-features = false, features = ["driver", "dynamic-loading", "cuda-12000"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = []
rnnoise = ["dep:nnnoiseless"]
onnx = ["dep:tract-onnx", "dep:crossbeam-queue"]
aec = ["dep:rustfft"]
mpsenet = ["onnx", "dep:rustfft"]
bsrnn = ["onnx", "dep:rustfft"]
mossformer2 = ["onnx", "dep:rustfft", "dep:kaldi-native-fbank"]
sgmse = ["onnx", "dep:rustfft"]
gtcrn = ["onnx", "dep:rustfft"]
dpdfnet = ["onnx", "dep:rustfft"]
accelerators = ["onnx", "dep:tract-metal", "dep:metal", "dep:tract-cuda", "dep:cudarc"]
visqol = ["dep:audio_samples", "dep:audio_samples_qoe", "dep:ndarray"]
live = ["dep:cpal"]
full = ["rnnoise", "onnx", "aec", "mpsenet", "bsrnn", "mossformer2", "sgmse", "gtcrn", "dpdfnet", "accelerators", "visqol", "live"]

[dev-dependencies]
minisign = "0.9.1"
prost = "0.14"

[package.metadata.docs.rs]
features = ["rnnoise", "aec", "mpsenet", "bsrnn", "mossformer2", "sgmse", "gtcrn", "dpdfnet", "visqol"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("deepfilter", "live", "m4a-encode", "fdk-aac-encoder", "onnx", "mpsenet", "bsrnn", "mossformer2", "sgmse", "gtcrn", "dpdfnet", "accelerators", "visqol"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
