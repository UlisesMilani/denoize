[package]
name = "denoize-desktop"
version = "0.72.0"
description = "Desktop interface for denoize"
authors = ["denoize"]
edition = "2021"
rust-version = "1.96"

# Keep the desktop app as an independently locked workspace. The repository
# root workspace owns the CLI/library and CLAP plug-in release graph.
[workspace]

[lib]
name = "denoize_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
denoize = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.11"
sha2 = "0.10.9"
fs2 = "0.4.3"
tempfile = "3.27.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[features]
default = ["full", "live"]
full = ["denoize/full"]
live = ["denoize/live"]
fdk-aac-encoder = ["denoize/fdk-aac-encoder"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
