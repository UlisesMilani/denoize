[package]
name = "denoize-wasm"
version = "0.90.2"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Scalar finite and incremental WASM boundary for denoize"
publish = false

[lib]
name = "denoize_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.114"

[dev-dependencies]
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
